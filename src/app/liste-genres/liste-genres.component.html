<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
        <app-update-genre
          [genre]="updatedGenre"
          [ajout]="ajout"
          (genreUpdated)="genreUpdated($event)">
        </app-update-genre>
      </div>

      <table class="table table-striped">
        <thead>
          <tr><th>Id</th><th>Nom Genre</th><th>Actions</th></tr>
        </thead>
        <tbody>
          @for (gen of genres; track gen.idGenre) {
            <tr>
              <td>{{ gen.idGenre }}</td>
              <td>{{ gen.nomGenre }}</td>
              <td><a class="btn btn-success btn-sm" (click)="updateGenre(gen)">Editer</a></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
